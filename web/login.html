<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mission — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  @property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
  :root{
    --bg:#05060b;
    --panel:rgba(15,17,28,.62);
    --stroke:rgba(140,160,255,.14);
    --txt:#e8ecff;
    --muted:#7d86ad;
    --cyan:#2ff3ff;
    --violet:#8b5cff;
    --pink:#ff3d9a;
    --ok:#36e5a0;
    --r:16px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Inter",system-ui,sans-serif;
    color:var(--txt);
    background:var(--bg);
    display:grid;
    place-items:center;
    padding:28px;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- animated background ---------- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden}
  .orb{
    position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;
    animation:drift 22s ease-in-out infinite alternate;
    will-change:transform;
  }
  .orb.a{width:46vw;height:46vw;left:-10vw;top:-12vw;background:radial-gradient(circle at 30% 30%,var(--violet),transparent 62%)}
  .orb.b{width:40vw;height:40vw;right:-8vw;top:8vh;background:radial-gradient(circle at 60% 40%,var(--cyan),transparent 62%);animation-duration:28s}
  .orb.c{width:36vw;height:36vw;left:22vw;bottom:-16vw;background:radial-gradient(circle at 50% 50%,var(--pink),transparent 60%);animation-duration:34s}
  @keyframes drift{
    from{transform:translate3d(0,0,0) scale(1)}
    to  {transform:translate3d(6vw,-5vh,0) scale(1.18)}
  }
  .grid{
    position:absolute;inset:-50% -50%;
    background-image:
      linear-gradient(rgba(130,150,255,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(130,150,255,.07) 1px,transparent 1px);
    background-size:52px 52px;
    transform:perspective(620px) rotateX(62deg) translateY(-6%);
    mask-image:radial-gradient(ellipse at 50% 35%,#000 10%,transparent 68%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 35%,#000 10%,transparent 68%);
    animation:scroll 18s linear infinite;
  }
  @keyframes scroll{to{background-position:0 52px,52px 0}}
  .noise{
    position:absolute;inset:0;opacity:.035;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(0,0,0,.72) 100%)}

  /* ---------- card ---------- */
  .wrap{position:relative;z-index:1;width:100%;max-width:430px}

  .card{
    position:relative;
    background:var(--panel);
    backdrop-filter:blur(26px) saturate(140%);
    -webkit-backdrop-filter:blur(26px) saturate(140%);
    border:1px solid var(--stroke);
    border-radius:calc(var(--r) + 6px);
    padding:38px 34px 30px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.07) inset,
      0 30px 70px -20px rgba(0,0,0,.85),
      0 0 0 1px rgba(0,0,0,.4);
    animation:rise .7s cubic-bezier(.2,.9,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}

  /* conic glow ring */
  .card::before{
    content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;
    background:conic-gradient(from var(--ang),transparent 0 52%,var(--cyan) 64%,var(--violet) 76%,var(--pink) 86%,transparent 96%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:spin 7s linear infinite;
    opacity:.85;pointer-events:none;
  }
  @keyframes spin{to{--ang:360deg}}

  /* ---------- header ---------- */
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .mark{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
    background:linear-gradient(145deg,var(--violet),var(--cyan));
    box-shadow:0 0 26px -4px rgba(139,92,255,.75);
  }
  .mark svg{width:21px;height:21px;stroke:#070810;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.14em}
  .brand span{display:block;font:400 11px/1.4 "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.05em;margin-top:2px}

  h2{margin:0 0 6px;font-size:25px;font-weight:600;letter-spacing:-.02em}
  .sub{margin:0 0 26px;color:var(--muted);font-size:13.5px}

  /* ---------- fields ---------- */
  .field{position:relative;margin-bottom:16px}
  .field input{
    width:100%;height:52px;padding:20px 44px 6px 14px;
    font:500 14.5px/1 "Inter",sans-serif;color:var(--txt);
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.09);
    border-radius:var(--r);outline:none;
    transition:border-color .2s,box-shadow .25s,background .2s;
  }
  .field label{
    position:absolute;left:15px;top:16px;font-size:14px;color:var(--muted);
    pointer-events:none;transform-origin:left top;
    transition:transform .18s cubic-bezier(.2,.9,.2,1),color .18s;
  }
  .field input:focus{
    border-color:rgba(47,243,255,.55);
    background:rgba(47,243,255,.045);
    box-shadow:0 0 0 4px rgba(47,243,255,.1),0 0 28px -10px rgba(47,243,255,.6);
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label{
    transform:translateY(-9px) scale(.76);color:var(--cyan);
  }
  .field .ico{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;stroke:var(--muted);stroke-width:1.9;fill:none;
    stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s;
  }
  .field input:focus ~ .ico{stroke:var(--cyan)}
  .field .toggle{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:none;border:0;padding:8px;cursor:pointer;line-height:0;border-radius:8px;
  }
  .field .toggle:hover svg{stroke:var(--txt)}
  .field .toggle svg{width:18px;height:18px;stroke:var(--muted);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}

  /* strength meter */
  .meter{height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:-6px 2px 16px}
  .meter i{display:block;height:100%;width:0;border-radius:99px;transition:width .3s,background .3s}

  /* ---------- row ---------- */
  .row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px;font-size:13px}
  .check{display:inline-flex;align-items:center;gap:9px;color:var(--muted);cursor:pointer;user-select:none}
  .check input{position:absolute;opacity:0;width:0;height:0}
  .box{
    width:17px;height:17px;border-radius:5px;border:1px solid rgba(255,255,255,.2);
    display:grid;place-items:center;transition:all .18s;
  }
  .box svg{width:11px;height:11px;stroke:#070810;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s}
  .check input:checked + .box{background:linear-gradient(145deg,var(--cyan),var(--violet));border-color:transparent;box-shadow:0 0 14px -2px rgba(47,243,255,.8)}
  .check input:checked + .box svg{opacity:1}
  .check:hover{color:var(--txt)}
  a.link{color:var(--cyan);text-decoration:none;transition:opacity .18s,text-shadow .18s}
  a.link:hover{opacity:.85;text-shadow:0 0 12px rgba(47,243,255,.7)}

  /* ---------- button ---------- */
  .btn{
    position:relative;width:100%;height:52px;border:0;border-radius:var(--r);cursor:pointer;
    font:600 15px/1 "Inter",sans-serif;letter-spacing:.02em;color:#05060b;
    background:linear-gradient(100deg,var(--cyan),var(--violet) 55%,var(--pink));
    background-size:200% 100%;
    box-shadow:0 10px 34px -10px rgba(139,92,255,.9);
    transition:transform .14s,box-shadow .2s,background-position .5s;
    overflow:hidden;
  }
  .btn:hover{background-position:100% 0;box-shadow:0 14px 42px -10px rgba(47,243,255,.85);transform:translateY(-1px)}
  .btn:active{transform:translateY(1px) scale(.995)}
  .btn:disabled{cursor:progress;filter:saturate(.6)}
  .btn .lbl{display:inline-flex;align-items:center;gap:9px;justify-content:center}
  .btn svg{width:17px;height:17px;stroke:#05060b;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .btn.loading .lbl{visibility:hidden}
  .btn.loading::after{
    content:"";position:absolute;left:50%;top:50%;width:19px;height:19px;margin:-10px 0 0 -10px;
    border:2.4px solid rgba(5,6,11,.3);border-top-color:#05060b;border-radius:50%;
    animation:sp .65s linear infinite;
  }
  @keyframes sp{to{transform:rotate(1turn)}}

  /* ---------- divider + social ---------- */
  .div{display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--muted);font:600 10.5px/1 "JetBrains Mono",monospace;letter-spacing:.18em}
  .div::before,.div::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}

  .social{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .social button{
    height:46px;border-radius:13px;cursor:pointer;display:grid;place-items:center;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    transition:all .18s;
  }
  .social button:hover{background:rgba(255,255,255,.09);border-color:rgba(47,243,255,.4);transform:translateY(-2px)}
  .social svg{width:19px;height:19px;fill:var(--txt)}

  .foot{margin:26px 0 0;text-align:center;color:var(--muted);font-size:13px}

  /* status toast */
  .toast{
    position:absolute;left:50%;bottom:-62px;transform:translateX(-50%) translateY(10px);
    display:flex;align-items:center;gap:9px;white-space:nowrap;
    padding:11px 16px;border-radius:12px;font-size:13px;
    background:rgba(54,229,160,.1);border:1px solid rgba(54,229,160,.35);color:var(--ok);
    opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:15px;height:15px;stroke:var(--ok);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

  @media (max-width:420px){
    .card{padding:30px 22px 24px}
    h2{font-size:22px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition-duration:.01ms !important}
  }
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="grid"></div>
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div class="noise"></div><div class="vignette"></div>
</div>

<main class="wrap">
  <section class="card">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24"><path d="M12 2 3 7v6c0 5 3.8 8.4 9 9 5.2-.6 9-4 9-9V7l-9-5Z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg>
      </div>
      <div>
        <h1>Mission</h1>
        <span>agentic os · secure access</span>
      </div>
    </div>

    <h2>Welcome back</h2>
    <p class="sub">Sign in to continue to your workspace.</p>

    <form id="form" novalidate>
      <div class="field">
        <input type="email" id="email" placeholder=" " autocomplete="email" required />
        <label for="email">Email address</label>
        <svg class="ico" viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="m3 7 9 6 9-6"/></svg>
      </div>

      <div class="field">
        <input type="password" id="pass" placeholder=" " autocomplete="current-password" required />
        <label for="pass">Password</label>
        <button class="toggle" type="button" id="peek" aria-label="Show password">
          <svg id="eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
        </button>
      </div>
      <div class="meter"><i id="bar"></i></div>

      <div class="row">
        <label class="check">
          <input type="checkbox" checked />
          <span class="box"><svg viewBox="0 0 24 24"><path d="m5 13 4.5 4.5L19 7"/></svg></span>
          Keep me signed in
        </label>
        <span class="link" style="cursor:default" title="Regenerate the hash on the host: python3 auth.py hash">Host-managed</span>
      </div>

      <button class="btn" id="btn" type="submit">
        <span class="lbl">Sign in
          <svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="m12.5 6 6 6-6 6"/></svg>
        </span>
      </button>
    </form>

    <div class="toast" id="toast">
      <svg viewBox="0 0 24 24"><path d="m5 13 4.5 4.5L19 7"/></svg>
      Authenticated — redirecting…
    </div>
  </section>
</main>

<script>
  // password visibility
  const pass = document.getElementById('pass');
  const peek = document.getElementById('peek');
  const eye  = document.getElementById('eye');
  const OPEN = '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/>';
  const SHUT = '<path d="M3 3l18 18"/><path d="M10.6 6.2A9.9 9.9 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a18 18 0 0 1-2.6 3.4"/><path d="M6.6 7.9A17.6 17.6 0 0 0 2 12s3.6 6.5 10 6.5c1.4 0 2.6-.3 3.7-.8"/><path d="M9.5 10.3a2.8 2.8 0 0 0 3.9 3.9"/>';
  peek.addEventListener('click', () => {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    eye.innerHTML = show ? SHUT : OPEN;
    peek.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  // strength meter (purely visual feedback)
  const bar = document.getElementById('bar');
  pass.addEventListener('input', () => {
    const v = pass.value;
    let s = 0;
    if (v.length > 5) s++;
    if (v.length > 9) s++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++;
    if (/\d/.test(v)) s++;
    if (/[^A-Za-z0-9]/.test(v)) s++;
    const pct = [0, 20, 40, 60, 80, 100][s];
    const col = ['transparent', '#ff3d9a', '#ff9f3d', '#ffe03d', '#36e5a0', '#2ff3ff'][s];
    bar.style.width = pct + '%';
    bar.style.background = col;
    bar.style.boxShadow = s ? `0 0 10px ${col}` : 'none';
  });

  // real submit -> POST /api/login, cookie session set by the server
  const form  = document.getElementById('form');
  const btn   = document.getElementById('btn');
  const toast = document.getElementById('toast');
  const email = document.getElementById('email');

  function fail(msg) {
    toast.textContent = msg;
    toast.style.borderColor = 'rgba(255,61,154,.55)';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3200);
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!form.checkValidity()) {
      [...form.querySelectorAll('input:invalid')].forEach(i => {
        i.style.borderColor = 'rgba(255,61,154,.75)';
        i.addEventListener('input', () => (i.style.borderColor = ''), { once: true });
      });
      form.querySelector('input:invalid').focus();
      return;
    }
    btn.classList.add('loading');
    btn.disabled = true;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value, password: pass.value }),
      });
      if (r.ok) {
        toast.textContent = 'Authenticated — redirecting…';
        toast.classList.add('show');
        location.href = '/';
        return;
      }
      const d = await r.json().catch(() => ({}));
      fail(d.error === 'auth_not_configured'
        ? 'No password set on the host yet'
        : 'Invalid email or password');
    } catch (err) {
      fail('Cannot reach the server');
    }
    btn.classList.remove('loading');
    btn.disabled = false;
  });

  // subtle parallax tilt
  const card = document.querySelector('.card');
  if (matchMedia('(hover:hover)').matches && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
    window.addEventListener('mousemove', e => {
      const x = (e.clientX / innerWidth - .5) * 2;
      const y = (e.clientY / innerHeight - .5) * 2;
      card.style.transform = `perspective(1000px) rotateY(${x * 3}deg) rotateX(${-y * 3}deg)`;
    });
  }
</script>
</body>
</html>
