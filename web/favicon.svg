<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29f5ff"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#05070b"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none"
        stroke="url(#g)" stroke-opacity=".45" stroke-width="1.5"/>
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="15" fill="none" stroke="url(#g)" stroke-width="5.5"/>
    <circle cx="32" cy="32" r="4.4" fill="#ec4899"/>
  </g>
</svg>
